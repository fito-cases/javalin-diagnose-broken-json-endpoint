questions:
  - id: q1
    type: multiple_choice
    prompt: "Which Context call serializes an object to JSON, stages it as the result, and sets Content-Type to application/json in a single step?"
    knowledge_components:
      - execution-fact:javalin.ctx-json-sets-result-and-content-type
    bloom_level: KNOWLEDGE
    weight: 100
    choices:
      - id: a
        text: "ctx.result(jsonString)"
      - id: b
        text: "ctx.json(obj)"
      - id: c
        text: "ctx.header(\"Content-Type\", \"application/json\")"
      - id: d
        text: "ctx.status(200)"
    answer: b
